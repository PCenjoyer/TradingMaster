services:
  tradingmaster:
    build:
      context: .
      args:
        VERSION: local
    image: tradingmaster:local
    environment:
      TM_MODE: api
      TM_HTTP_ADDR: :8080
      TM_DAILY_LOSS_LIMIT: ${TM_DAILY_LOSS_LIMIT:-0.03}
      TM_KILL_SWITCH_DEFAULT: ${TM_KILL_SWITCH_DEFAULT:-false}
      TM_ADMIN_TOKEN: ${TM_ADMIN_TOKEN:-}
      TM_TELEGRAM_BOT_TOKEN: ${TM_TELEGRAM_BOT_TOKEN:-}
      TM_TELEGRAM_CHAT_ID: ${TM_TELEGRAM_CHAT_ID:-}
      TM_DATABASE_URL: ${TM_DATABASE_URL:-postgres://tradingmaster:tradingmaster-local@postgres:5432/tradingmaster?sslmode=disable}
      TM_PAPER_INITIAL_CAPITAL: ${TM_PAPER_INITIAL_CAPITAL:-10000}
      TM_PAPER_FEE_BPS: ${TM_PAPER_FEE_BPS:-10}
      TM_PAPER_SLIPPAGE_BPS: ${TM_PAPER_SLIPPAGE_BPS:-5}
      TM_BINANCE_TESTNET_ENABLED: ${TM_BINANCE_TESTNET_ENABLED:-false}
      TM_BINANCE_TESTNET_ORDER_MODE: ${TM_BINANCE_TESTNET_ORDER_MODE:-validate}
      TM_BINANCE_TESTNET_RECV_WINDOW_MS: ${TM_BINANCE_TESTNET_RECV_WINDOW_MS:-5000}
      TM_BINANCE_TESTNET_API_KEY: ${TM_BINANCE_TESTNET_API_KEY:-}
      TM_BINANCE_TESTNET_SECRET_KEY: ${TM_BINANCE_TESTNET_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradingmaster
      POSTGRES_USER: tradingmaster
      POSTGRES_PASSWORD: tradingmaster-local
    volumes:
      - tradingmaster-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingmaster -d tradingmaster"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  tradingmaster-postgres:
