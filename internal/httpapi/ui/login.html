<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Вход — TradingMaster</title>
  <link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">TM</div>
      <p class="eyebrow">TradingMaster · {{.Version}}</p>
      <h1 id="login-title">Панель управления</h1>
      <p class="muted">Введите административный токен. Он будет проверен сервером и не сохранится в браузерном хранилище.</p>
      {{if .Error}}<div class="notice notice-error" role="alert">{{.Error}}</div>{{end}}
      <form class="login-form" action="/ui/login" method="post">
        <label for="token">Административный токен</label>
        <input id="token" name="token" type="password" autocomplete="current-password" required {{if .Disabled}}disabled{{end}}>
        <button class="button button-primary" type="submit" {{if .Disabled}}disabled{{end}}>Войти</button>
      </form>
      <p class="security-note">Сессия хранится в защищённой HttpOnly cookie и автоматически завершится через 12 часов.</p>
    </section>
  </main>
</body>
</html>
