apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradingmaster
  namespace: tradingmaster
  labels:
    app.kubernetes.io/name: tradingmaster
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tradingmaster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tradingmaster
    spec:
      serviceAccountName: tradingmaster
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tradingmaster
      containers:
        - name: tradingmaster
          image: ghcr.io/pcenjoyer/tradingmaster:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tradingmaster
          env:
            - name: TM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: database-url
            - name: TM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: admin-token
                  optional: true
            - name: TM_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: telegram-bot-token
                  optional: true
            - name: TM_TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: telegram-chat-id
                  optional: true
            - name: TM_BINANCE_TESTNET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: binance-testnet-api-key
                  optional: true
            - name: TM_BINANCE_TESTNET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tradingmaster-secrets
                  key: binance-testnet-secret-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
