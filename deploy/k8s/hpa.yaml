apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tradingmaster
  namespace: tradingmaster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tradingmaster
  # Масштабирование включается после вынесения kill switch в общий durable store.
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
