apiVersion: v1
kind: ConfigMap
metadata:
  name: tradingmaster
  namespace: tradingmaster
  labels:
    app.kubernetes.io/name: tradingmaster
data:
  TM_MODE: api
  TM_HTTP_ADDR: :8080
  TM_DAILY_LOSS_LIMIT: "0.03"
  TM_KILL_SWITCH_DEFAULT: "true"
  TM_PAPER_INITIAL_CAPITAL: "10000"
  TM_PAPER_FEE_BPS: "10"
  TM_PAPER_SLIPPAGE_BPS: "5"
  TM_BINANCE_TESTNET_ENABLED: "false"
  TM_BINANCE_TESTNET_ORDER_MODE: validate
  TM_BINANCE_TESTNET_RECV_WINDOW_MS: "5000"
